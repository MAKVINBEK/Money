<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Личный учёт доходов, расходов и бюджета — приватно и офлайн"
    />

    <meta name="theme-color" content="#4F46E5" />
    <meta name="application-name" content="Akcha" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta name="apple-mobile-web-app-title" content="Akcha" />

    <script>
      try {
        const storedSettings = localStorage.getItem('akcha-settings');
        const parsedSettings = storedSettings ? JSON.parse(storedSettings) : null;
        const settings = parsedSettings?.settings ?? parsedSettings;

        if (settings?.theme === 'light' || settings?.theme === 'dark') {
          document.documentElement.dataset.theme = settings.theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute(
              'content',
              settings.theme === 'dark' ? '#0D111A' : '#4F46E5',
            );
        }
      } catch {
        // Invalid or unavailable local data must never block first paint.
      }
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" sizes="any" />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
      sizes="180x180"
    />

    <title>Akcha — личные финансы</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
